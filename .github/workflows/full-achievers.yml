name: Full Achievers

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

jobs:
  update-list:
    if: github.event.label.name == 'full-achievement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append achiever to list
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          raw_title="$ISSUE_TITLE"
          name="${raw_title#全成就玩家登记：}"
          name="${name:-${raw_title}}"
          line="- ${name}"
          if ! grep -Fxq -- "$line" FULL_ACHIEVERS.md; then
            printf '%s\n' "$line" >> FULL_ACHIEVERS.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add FULL_ACHIEVERS.md
            git commit -m "Add full achiever: ${name}" || exit 0
            git push
          fi
